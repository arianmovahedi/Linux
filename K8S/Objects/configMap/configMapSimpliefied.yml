apiVersion: v1
kind: ConfigMap
metadata:
  name: myconfigmap
data: 
  username: k8s-admin
  access_level: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: env-configmap
spec:
  containers:
    - name: app
      command: ["/bin/sh","-c","printenv"]
      image: busybox:latest
      envFrom:
        - configMapRef:
            name: myconfigmap
---
apiVersion: v1
kind: Pod
metadata:
  name: env-configmap
spec:
  containers:
  - name: envars-test-container
    image: nginc
    env:
    - name: CONFIGMAP_USERNAME
      valueFrom:
        configMapKeyRef:
          name: myconfigmap
          key: username