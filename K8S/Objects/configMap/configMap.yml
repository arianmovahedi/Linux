apiVersion: v1
kind: ConfigMap
immutable: false
metadata:
  name: game-demo
data:
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface-properties"
  game-properties: |
    enemy.type=aliens,monsters
    player.maximum-lives=5
  user-interface-properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
---
apiVersion: v1
kind: Pod
metadata: 
  name: configuration-map-demo-pod
spec:
  containers:
  - name: game-demo
    image: alpine
    command: ["sleep","3600"]
    env: 
      - name: PLAYER_INITIAL_LIVES
        valueFrom:
          configMapKeyRef:
            name: game-demo # ConfigMap name
            key: player_initial_lives
      - name: UI_PROPERTIES_FILE_NAME
        valueFrom:
          configMapKeyRef:
            name: game-demo
            key: ui_properties_file_name
    volumeMounts:
      - name: config
        mountPath: "/config"
        readOnly: true

  volumes:
    - name: config
      configMap:
        name: game-demo
        items:
          - key: "game.properties"
            path: "game.properties"
          - key: "user-interface-properties"
            path: "user-interface-properties"