apiVersion: v1
kind: Pod
metadata:
  name: random-generator
spec:
  containers:
  - image: k8spatterns/random-generator:1.0
    name: random-generator
  nodeSelector:
    disktype: ssd
    # We can use kubernetes defined node labels as well. for example we can define the node by its hostname
    # kubernetes.io/hostname: worker01.hudata.ir