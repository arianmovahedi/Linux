apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namepsace: globalDefault
spec:
  limits:
  - min: # minimum values for `requests` and `limits`
      memory: 250Mi
      cpu: 250m
    max:
      memory: 2Gi
      cpu: 2
    default: # default values for `limits` when no limits are specified
      memory: 500Mi
      cpu: 500m
    defaultRequest: # Default values for `requests` when no requests are specified
      memory: 250Mi
      cpu: 250m
    maxLimitRequestRatio: # Maximum ratio for `limit` to `request`
      memory: 2
      cpu: 4
    type: Container