apiVersion: v1
kind: Pod
metadata:
  name: random-generator
spec:
  containers:
  - image: k8spatterns/random-generator:1.0
    name: k8spatterns/random-generator:1.0
    resources:
      requests:
        cpu: 100m
        memory: 200m
      limits:
        memory: 200m
        # No maximum amount of CPU is not defined by design