apiVersion: v1
kind: Pod
metadata:
  name: random-generator
spec:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/zone # a topologyKey is the key of the Node label where identical 
                                      # values are considered to be in the same
                                      # topology
      whenUnsatisfiable: DoNotSchedule # or ScheduleAnyway
      labelSelector:
        matchLabels:
          app: bar # Pods that match this selector are grouped together
  containers:
    - image: k8spatterns/random-generator:1.0
      name: random-generator