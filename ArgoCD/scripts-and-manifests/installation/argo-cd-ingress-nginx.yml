apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argo.hudata.ir
    secretName: argo-tls
  rules:
  - host: argo.hudata.ir
    http:
      paths:
        - path: /
          pathType: Prefix
          backend: 
            service:
              name: argocd-server
              port:
                number: 443