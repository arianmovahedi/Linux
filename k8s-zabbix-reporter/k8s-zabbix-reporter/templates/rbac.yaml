apiVersion: v1
kind: ServiceAccount
metadata: 
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: 
    name: {{ .Release.Name }}
rules:
    - apiGroups: [""]
      resources: ["nodes","pods"]
      verbs: ["get","list"]
    - apiGroups: [""]
      resources: ["nodes/proxy"]
      verbs: ["get"]
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ .Release.Name }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ .Release.Name }}
subjects:
    - kind: ServiceAccount
      name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}