schedule: "*/5 * * * *"

image:
  repository: python
  tag: 3.12-alpine
  pullPolicy: IfNotPresent

zabbix:
  server: "192.168.0.15"
  port: 10051
  host: k8s-cluster

apiServer:
  cidrs:
    - 192.168.0.12/32
    - 192.168.0.13/32
    - 192.168.0.14/32
  port: 6443

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi