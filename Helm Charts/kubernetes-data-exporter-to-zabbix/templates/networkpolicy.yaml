apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
    podSelector:
        matchLabels:
            app: {{ .Release.Name }}
    policyTypes: [Ingress, Egress]
    ingress: []
    egress: 
      - to:
        - ipBlock:
            cidr: {{ .Values.zabbix.server }}/32
        ports:
            - protocol: TCP
              port: {{ .Values.zabbix.port }}
      - to:
        {{- range .Values.apiServer.cidrs }}
        - ipBlock: 
            cidr: {{ . }}
        {{- end }}
        ports: 
            - protocol: TCP
              port: {{ .Values.apiServer.port }}